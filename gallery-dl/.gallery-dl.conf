{
  "base-directory": "/mnt/media/gallery-dl",
  "extractor": {
    "metadata-url": "gdl_url",
    "patreon": {
      "cookies": {
        "session_id": "REPLACE_ME"
      },
      "directory": [
        "{creator[full_name]}",
        "{date:%Y-%m-%d} - {title} [{id}]"
      ],
      "filename": "{num:>03}_{filename}.{extension}",
      "postprocessors": [
        {
          "name": "metadata",
          "event": "post",
          "mode": "json",
          "filename": "post.json",
          "indent": 2
        }
      ]
    }
  },
  "postprocessor": {
    "name": "metadata",
    "mode": "json",
    "indent": 2,
    "sort": true,
    "archive": "metadata-{category}.sqlite3"
  },
  "output": {
    "logfile": {
      "format": "{asctime} {name}: {message}",
      "format-date": "%H:%M:%S",
      "path": "~/gallery-dl-{asctime}.log",
      "encoding": "ascii",
      "defer": true
    }
  }
}
