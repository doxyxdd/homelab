volumes:
    mysql_data:
    romm_resources:
    romm_redis_data:

services:
    romm:
        image: rommapp/romm:latest
        container_name: romm
        restart: unless-stopped
        environment:
            - DB_HOST=romm-db
            - DB_NAME=romm # Should match MARIADB_DATABASE in mariadb
            - DB_USER=romm-user # Should match MARIADB_USER in mariadb
            - DB_PASSWD=${DB_PASS:?error} # Should match MARIADB_PASSWORD in mariadb
            - ROMM_AUTH_SECRET_KEY= # Generate a key with `openssl rand -hex 32`
            - SCREENSCRAPER_USER= # These are the recommended metadata providers
            - SCREENSCRAPER_PASSWORD= # https://docs.romm.app/latest/getting-started/metadata-providers/#screenscraper
            - RETROACHIEVEMENTS_API_KEY= # https://docs.romm.app/latest/getting-started/metadata-providers/#retroachievements
            - STEAMGRIDDB_API_KEY= # https://docs.romm.app/latest/getting-started/metadata-providers/#steamgriddb
            - HASHEOUS_API_ENABLED=true # https://docs.romm.app/latest/getting-started/metadata-providers/#hasheous
            - OIDC_ENABLED=true
            - OIDC_AUTOLOGIN=true
            - OIDC_PROVIDER=authentik
            - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:?error}
            - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:?error}
            - OIDC_REDIRECT_URI=https://romm.doxy.moe/api/oauth/openid
            - OIDC_SERVER_APPLICATION_URL=https://auth.doxy.moe/application/o/romm
            - ROMM_BASE_URL=https://romm.romm.app
        volumes:
            - romm_resources:/romm/resources # Resources fetched from IGDB (covers, screenshots, etc.)
            - romm_redis_data:/redis-data # Cached data for background tasks
            - /home/apps/mnt/romm/library:/romm/library # Your game library. Check https://github.com/rommapp/romm?tab=readme-ov-file#folder-structure for more details.
            - /home/apps/mnt/romm/assets:/romm/assets # Uploaded saves, states, etc.
            - /home/apps/mnt/romm/config:/romm/config # Path where config.yml is stored
            # - /path/to/sync:/romm/sync # Required for ENABLE_SYNC_FOLDER_WATCHER and ENABLE_SYNC_PUSH_PULL
        ports:
            - 9999:8080
        depends_on:
            romm-db:
                condition: service_healthy
                restart: true

    romm-db:
        image: mariadb:latest
        container_name: romm-db
        restart: unless-stopped
        environment:
            - MARIADB_ROOT_PASSWORD= # Use a unique, secure password
            - MARIADB_DATABASE=romm
            - MARIADB_USER=romm-user
            - MARIADB_PASSWORD=${DB_PASS:?error}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
            start_period: 30s
            start_interval: 10s
            interval: 10s
            timeout: 5s
            retries: 5
