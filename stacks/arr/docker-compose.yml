# /opt/stacks/arr/docker-compose.yml (gluetun + qbittorrent excerpt)
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8081:8081"        # qBittorrent web UI (published via gluetun)
    volumes:
      - /home/doxy/mnt/gluetun/data:/gluetun
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${PROTON_WG_PRIVATE_KEY}
      SERVER_COUNTRIES: ${PROTON_COUNTRY:-United States}
      SERVER_CITIES: ${PROTON_CITIES:-Seattle,Los Angeles}
      # Proton port forwarding via NAT-PMP — Gluetun fetches the forwarded port automatically
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_PROVIDER: protonvpn
      VPN_PORT_FORWARDING_UP_COMMAND: >
        /bin/sh -c 'wget -O- -nv --retry-connrefused --header="Authorization: Bearer ${QBITTORRENT_API_KEY}" --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8081/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >
        /bin/sh -c 'wget -O- -nv --retry-connrefused --header="Authorization: Bearer ${QBITTORRENT_API_KEY}" --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: "service:gluetun"     # shares gluetun's network → all traffic via VPN
    depends_on:
      - gluetun
    environment:
      PUID: "1000"
      PGID: "1000"
      WEBUI_PORT: "8081"
    volumes:
      - /home/doxy/mnt/qbittorrent/config/:/config
      - /mnt/media/downloads:/mnt/media/downloads
    restart: unless-stopped
