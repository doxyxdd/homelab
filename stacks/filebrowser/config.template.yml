http:
  trustProxyHeaders: true
  externalUrl: 'https://files.doxy.moe' # if you plan to share externally, share links will be generated with this url
server:
  database:
    path: "data/filebrowser.sqlite"
  cacheDir: "data/tmp"
  sources:
    - path: "/files/shared"
      name: "Shared Files"
      config:
        defaultEnabled: true
    - path: "/files/users"
      name: My Files
      config:
        defaultEnabled: true # all users get this source on create; v2.0.1+ also merges for existing users on startup
        createUserDir: true # a user "bill" will see files from /files/users/bill
    - path: "/home/filebrowser" # mount the docker home folder for convenience
      name: Backend
    # Add your sources here.
  maxArchiveSize: 50 # maxiumum pre-archive size users are allowed to download at once.
auth:
  tokenExpirationHours: 2
  methods:
    password:
      enabled: false
    oidc:
      enabled: true
      clientId: ${CLIENT_ID}
      clientSecret: ${CLIENT_SECRET}
      issuerUrl: "https://auth.doxy.moe/application/o/filebrowser/"
      adminGroup: "authentik Admins"
